[workspace]
resolver = "3"
members = ["crates/pas-cekirdek", "crates/cargo-pas", "crates/pas-web"]
# Örnekler ve testlerin `target/` altında oluşturduğu projeler kendi başına
# birer Pas projesidir; bu çalışma alanına ait değildir.
exclude = ["ornekler", "target"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kasimtmc/Pas"

[workspace.dependencies]
pas-cekirdek = { path = "crates/pas-cekirdek" }

[profile.release]
# Dağıtılan dosyalar küçük olsun.
strip = true
lto = "thin"

# Tarayıcıya indirilen WebAssembly dosyası küçük olsun.
[profile.release.package.pas-web]
opt-level = "s"
