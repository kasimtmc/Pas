name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust araç zinciri
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rust-analyzer clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Biçim
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Testler
        run: cargo test --all
      - name: Oyun alanı (WebAssembly)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p pas-web --target wasm32-unknown-unknown

  eklenti:
    name: RustRover eklentisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Rust araç zinciri
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Testler ve eklenti paketi
        working-directory: eklenti
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v4
        with:
          name: pas-eklenti
          path: eklenti/build/distributions/*.zip

  vscode:
    name: VS Code eklentisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust araç zinciri
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - name: cargo-pas
        run: |
          cargo build -p cargo-pas
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bağımlılıklar
        working-directory: vscode
        run: npm ci
      - name: VS Code içinde testler
        working-directory: vscode
        run: xvfb-run -a npm test
      - name: Paket
        working-directory: vscode
        run: npm run paketle
      - uses: actions/upload-artifact@v4
        with:
          name: pas-vscode
          path: vscode/pas.vsix
